# Local development, integration tests and the demo Docker stack. NEVER use in production:
# every value below is public (it is in the repository).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/warden}
    username: ${DB_USERNAME:warden}
    password: ${DB_PASSWORD:warden}

app:
  jwt:
    secret: ${JWT_SECRET:3q2+7wGq8Y1m0fV6Zt9cJb4uXk2sR5nP0aL7eH1dQ8M=}
  auth:
    # Browsers accept Secure cookies on http://localhost only; the dev stack runs on plain http.
    cookie-secure: ${COOKIE_SECURE:false}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-password: ${SEED_USER_PASSWORD:User@123}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
