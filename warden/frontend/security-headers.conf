# Included in every location that sets its own add_header: nginx does not inherit add_header from the
# server block into a location that has any add_header of its own.
# CSP: everything from this origin only. style-src keeps 'unsafe-inline' because the toast library
# injects a <style> tag; scripts stay strict, which is what protects the in-memory access token.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
