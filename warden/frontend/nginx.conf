# Same origin for the browser: the page and /api both come from this server, so the refresh-token
# cookie (SameSite=Strict, Path=/api/auth) is sent and no CORS is involved.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # nginx is the edge: overwrite (never append to) whatever X-Forwarded-For the client sent,
        # otherwise a forged value would become the client IP used by the login rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /people, ...) all serve the SPA shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
